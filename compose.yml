# Local infrastructure for the Bank Liquidity Management System.
#
#   Start:  podman compose up -d      (or: podman-compose up -d)
#   Stop:   podman compose down
#   Wipe:   podman compose down -v     (also drops the Postgres/Redis volumes)
#
# Three backing services, mirroring the architecture:
#   - kafka     : the event backbone (topics partitioned by currency)
#   - postgres  : the append-only ledger + transactional outbox (JSONB payloads)
#   - redis     : the position read model (CQRS read side) + risk-health flags
#
# Images are fully-qualified (docker.io/...) so Podman doesn't hit short-name registry
# resolution; Docker resolves them either way.
services:

  kafka:
    image: docker.io/apache/kafka:3.9.0
    container_name: ls-kafka
    ports:
      - "9092:9092"           # what host apps connect to
    environment:
      # ---- KRaft: controller + broker in one node (no ZooKeeper) ----
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # ---- Listeners ----
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # ---- Single-node friendly settings ----
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      # Broker answers API version requests once it is truly ready to serve clients.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: docker.io/library/postgres:16
    container_name: ls-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: liquidity
      POSTGRES_PASSWORD: liquidity
      POSTGRES_DB: liquidity
    volumes:
      - ls-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquidity -d liquidity"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:7
    container_name: ls-redis
    ports:
      - "6379:6379"
    volumes:
      - ls-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ls-postgres-data:
  ls-redis-data:
